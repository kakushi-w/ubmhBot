name: ubmhbot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ubmhbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: check credentials
        env:
          WIKIDOT_USERNAME: ${{ secrets.WIKIDOT_USERNAME }}
          WIKIDOT_PASSWORD: ${{ secrets.WIKIDOT_PASSWORD }}
        run: |
          ok=1
          if [ -z "$WIKIDOT_USERNAME" ]; then echo "WIKIDOT_USERNAME: empty"; ok=0; else echo "WIKIDOT_USERNAME: set (${#WIKIDOT_USERNAME} chars)"; fi
          if [ -z "$WIKIDOT_PASSWORD" ]; then echo "WIKIDOT_PASSWORD: empty"; ok=0; else echo "WIKIDOT_PASSWORD: set"; fi
          if [ "$ok" = "0" ]; then echo "::error::secret not reaching the runner"; exit 1; fi

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: node dist/index.js
        env:
          WIKIDOT_USERNAME: ${{ secrets.WIKIDOT_USERNAME }}
          WIKIDOT_PASSWORD: ${{ secrets.WIKIDOT_PASSWORD }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: update bot state"
            git pull --rebase --autostash
            git push
          fi
